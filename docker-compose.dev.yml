version: '3.9'

# Development override — runs only DB + Redis so you can `npm run start:dev` locally

services:
  postgres:
    image: postgres:16-alpine
    container_name: real_estate_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: real_estate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - dev_network

  redis:
    image: redis:7-alpine
    container_name: real_estate_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - dev_network

volumes:
  postgres_dev_data:

networks:
  dev_network:
    driver: bridge
